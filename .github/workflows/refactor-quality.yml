name: Refactor quality
# Private repository: one Linux / Python 3.11 run per PR and main push (free minutes are
# limited); the full matrix runs on demand (Actions > Run workflow). The public repository
# always runs the full matrix, including native Windows.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ${{ fromJSON((github.event_name == 'workflow_dispatch' || !github.event.repository.private) && '["3.11", "3.14"]' || '["3.11"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' ruff pyright build
      - name: Domain, application and adapter lint
        run: ruff check agent_dev/domain agent_dev/ports agent_dev/application agent_dev/adapters agent_dev/migration agent_dev/entrypoints.py agent_dev/ui/dashboard.py agent_dev/ui/studio_server.py agent_dev/ui/setup_server.py agent_dev/ui/source_server.py agent_dev/ui/feature_routes.py agent_dev/ui/workflow_server.py agent_dev/ui/review_server.py tests/test_source_search.py tests/test_platform_web.py scripts/smoke_wheel.py scripts/smoke_live.py agent_dev/runners/usage.py agent_dev/runners/gemini_cli.py tests/test_reuse_next.py tests/test_workflow_sqlite.py tests/test_refactor_migration.py tests/test_tool_boundaries.py tests/test_workflow_runtime.py tests/test_reusable_workspace.py tests/test_studio.py tests/test_project_setup.py tests/test_model_routing.py tests/test_multi_ai.py tests/test_mcp_modern.py
      - name: Changed architecture typing
        run: pyright agent_dev/domain agent_dev/ports agent_dev/application agent_dev/adapters agent_dev/migration agent_dev/entrypoints.py agent_dev/ui/dashboard.py agent_dev/ui/studio_server.py agent_dev/ui/setup_server.py agent_dev/ui/source_server.py agent_dev/ui/feature_routes.py agent_dev/ui/workflow_server.py agent_dev/ui/review_server.py
      - name: Unit, regression, crash, security, migration and rollback
        run: python -m pytest -q --junitxml=test-results.xml
      - run: python -m build --wheel
      - name: Standalone wheel across independent projects
        run: python scripts/smoke_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.python }}
          path: |
            test-results.xml
            dist/*.whl
  portable:
    runs-on: ${{ matrix.os }}
    # A hung test must fail the job quickly instead of holding a runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || !github.event.repository.private) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON((github.event_name == 'workflow_dispatch' || !github.event.repository.private) && '["3.11", "3.14"]' || '["3.11"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build
      - name: Portable locking, workspace, upgrades, budgets and HTTP
        timeout-minutes: 20
        run: python -m pytest -v -o faulthandler_timeout=240 tests/test_core_io.py tests/test_reusable_workspace.py tests/test_reuse_next.py tests/test_workflow_sqlite.py tests/test_studio.py tests/test_project_setup.py tests/test_model_routing.py tests/test_multi_ai.py tests/test_mcp_client.py tests/test_mcp_modern.py tests/test_integrated_backup.py tests/test_platform_web.py tests/test_windows_launch.py tests/test_worktree_windows.py tests/test_source_windows_reads.py tests/test_interrupted_changes.py tests/test_worktree_cleanup.py --junitxml=portable-results.xml
      - run: python -m build --wheel
      - name: Installed wheel across platforms
        shell: bash
        run: python scripts/smoke_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-${{ matrix.os }}-${{ matrix.python }}
          path: |
            portable-results.xml
            dist/*.whl
